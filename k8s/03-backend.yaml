apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediguard-backend
  namespace: mediguard-production
  labels:
    app: mediguard-backend
    tier: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mediguard-backend
  template:
    metadata:
      labels:
        app: mediguard-backend
        tier: api
    spec:
      containers:
      - name: backend
        image: mediguard-backend:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: mediguard-backend-config
        - secretRef:
            name: mediguard-backend-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mediguard-production
  labels:
    app: mediguard-backend
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    name: http
  selector:
    app: mediguard-backend
